<section class="pagina-carrinho">
 <h1>Carrinho</h1>
 @if (carrinhoFacade.carrinhoVazio()) {
    <p>Seu Carrinho está vazio.</p>
    <button mat-raised-button color="primary" routerLink="/produtos">Ver Produtos</button>
 } @else {
    <section class="lista-carrinho">
       @for(item of carrinhoFacade.itens(); track $index){
        <article class="item-carrinho">
            <div class="item">
                <p><strong>{{item.nome}}</strong></p>
                
                <button mat-strocked-button color="warn" type="button" 
                (click)="removerItem($index)">Remover Item</button>
            </div>
        </article>

       }
    </section>
    <hr />
<section class="resumo-carrinho">
<h3>Resumo da compra</h3>
<p><strong>Itens do carrinho: </strong>{{carrinhoFacade.quantidade()}}</p>
<p><strong> Total: </strong>{{carrinhoFacade.total()}}</p>
</section>
<section class="acoes-carrinho">
    <button mat-raised-button color="primary" type="button" (click)="limparCarrinho()"> Limpar carrinho</button>
    <button mat-raised-button color="primary" type="button" routerLink="/produtos">Ver produtos</button>
    <button mat-raised-button class="btn-confirmar" type="button" routerLink="/checkout">Finalizar compra</button>
    <button mat-raised-button class="btn-cancelar" type="button" (click)="cancelarCompra()">Cancelar compra</button>

</section>
}

</section>
